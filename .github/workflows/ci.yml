name: ci
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Install Netsy file reader
        run: go install github.com/netsy-dev/netsy/cmd/read-netsy-file@latest
      - name: Check and validate
        run: make ci
